<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card-login {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .card-login h2 {
            color: #333;
            margin-bottom: 5px;
        }
        .card-login p {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .grupo {
            text-align: left;
            margin-bottom: 15px;
        }
        .grupo label {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
            color: #444;
        }
        .grupo input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box; 
        }
        .btn-entrar {
            width: 100%;
            background-color: #2b78e4;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.3s;
        }
        .btn-entrar:hover {
            background-color: #1c5bb5;
        }
        .btn-entrar:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        #mensagemErro {
            color: #d9534f;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card-login">
        <i class="fa-solid fa-screwdriver-wrench" style="font-size: 45px; color: #2b78e4; margin-bottom: 10px;"></i>
        <h2>Sistema de Gestão</h2>
        <p>Acesse com suas credenciais</p>

        <form id="formLogin">
            <div class="grupo">
                <label>Login</label>
                <input type="text" id="usuario" placeholder="Digite seu login" required>
            </div>
            
            <div class="grupo">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-entrar" id="btnEntrar">
                Entrar no Sistema
            </button>
        </form>

        <div id="mensagemErro"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
